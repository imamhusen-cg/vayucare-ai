name: VayuCare AI CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-and-build:
    name: Automated Verification & Test Suites
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node.js 24.x
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install Frontend Dependencies
        run: npm ci

      - name: Run Unit & Integration Test Suites (Vitest)
        run: npm test

      - name: Verify TypeScript Type Checking & Production Build
        run: npm run build

      - name: Install Server Dependencies & Run API Test Suite
        run: |
          cd server
          npm ci
          npm test
